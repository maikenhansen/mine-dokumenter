<!doctype html><html lang="nb"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mine dokumenter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400;1,700&family=Caladea:ital,wght@0,400;0,700;1,400;1,700&family=Arimo:ital,wght@0,400;0,700;1,400;1,700&family=Tinos:ital,wght@0,400;0,700;1,400;1,700&family=EB+Garamond:ital,wght@0,400;0,700;1,400;1,700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: mappeliste til venstre, verktøylinje øverst, A4-ark i midten. Arket er alltid hvitt papir. */
:root{
  --bg:#e9ecef; --panel:#f8f9fa; --fg:#1d2329; --muted:#5b6570; --line:#d3d9df;
  --accent:#2f5d7c; --accent-soft:#dfe9f0; --danger:#a33a2c; --ok:#2e6b45;
  --paper:#ffffff; --ink:#000000;
  --ui:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --doc:Calibri, Carlito, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15181b; --panel:#1e2226; --fg:#e6e9ec; --muted:#9aa4ad; --line:#343b42;
  --accent:#8db8d6; --accent-soft:#24323c; --danger:#e3907f; --ok:#86c49c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15181b; --panel:#1e2226; --fg:#e6e9ec; --muted:#9aa4ad; --line:#343b42;
  --accent:#8db8d6; --accent-soft:#24323c; --danger:#e3907f; --ok:#86c49c; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;overflow:hidden}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:380px minmax(0,1fr) 480px;grid-template-rows:auto minmax(0,1fr);height:100%}
.app > .topbar{grid-column:1 / 3;grid-row:1}
.app > .tools{grid-column:1;grid-row:2}
.app > .main{grid-column:2;grid-row:2}
.app > .side{grid-column:3;grid-row:1 / 3}
.topbar{display:flex;align-items:center;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.topbar .titlein{flex:1 1 auto;width:100%;font-size:22px;font-weight:700}
/* Verktøypanel til venstre: dokumentvalg og formatering under hverandre */
@media (min-width:761px){
  .tools{background:var(--panel);border-right:1px solid var(--line);overflow:auto;min-height:0;display:flex;flex-direction:column;gap:14px;padding:16px 16px 24px}
  .tools .docbar{flex-direction:column;flex-wrap:nowrap;align-items:stretch;padding:0;border:0;background:none;gap:10px}
  .tools .docbar label{font-size:14px;flex-direction:column;align-items:stretch;gap:4px}
  .tools .docbar select{padding:8px 9px;font-size:16px}
  .tools .status{font-size:14px;min-width:0}
  .tools .docbar .btn{font-size:16px;padding:9px 12px}
  .tools .toolbar{flex-direction:column;flex-wrap:nowrap;align-items:stretch;padding:0;border:0;background:none;gap:0}
  .tools .grp{flex-wrap:wrap;border-right:0;border-top:1px solid var(--line);padding:12px 0;margin:0;gap:6px}
  .tools .tb{min-width:42px;height:42px;font-size:17px;padding:0 9px}
  .tools .tb svg{width:20px;height:20px}
  .tools .toolbar select{height:42px;font-size:16px;flex:1 1 100%}
  .tools .toolbar select.font{width:auto}
  .tools .toolbar .lbl{font-size:14px;flex:1 1 100%;padding:0}
}
/* Sidepanel */
.side{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;
  padding-right:max(0px, env(safe-area-inset-right,0px))}
.side-head{padding:18px 16px 12px;display:flex;flex-direction:column;gap:10px}
.brand{font-weight:700;font-size:24px;letter-spacing:.01em}
.newdoc{background:var(--accent);color:var(--panel);border:0;border-radius:6px;padding:13px 16px;font-size:18px;font-weight:600;cursor:pointer}
.side-list{overflow:auto;padding:4px 10px 16px;flex:1;min-height:0}
.folder{margin-top:10px}
.folder-head{display:flex;align-items:center;gap:6px;padding:8px 8px;font-size:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.folder-head .count{font-weight:400;letter-spacing:0}
.folder-head .grow{flex:1}
.iconbtn{background:none;border:0;cursor:pointer;color:var(--muted);padding:2px 5px;border-radius:4px;font-size:13px;line-height:1}
.iconbtn:hover{background:var(--accent-soft);color:var(--fg)}
.doclink{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:12px 14px;cursor:pointer;line-height:1.35;font-size:20px}
.doclink:hover{background:var(--accent-soft)}
.doclink.active{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.doclink .t{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doclink .d{display:block;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.doclink{position:relative}
.doclink .ren{position:absolute;right:6px;top:8px;display:none;align-items:center;justify-content:center;width:28px;height:28px;border-radius:4px;color:var(--muted);font-size:16px;line-height:1;background:var(--panel)}
.doclink:hover .ren,.doclink:focus-visible .ren{display:inline-flex}
.doclink .ren:hover{background:var(--accent-soft);color:var(--fg)}
.doclink:hover .t{padding-right:32px}
.renbox{padding:4px 4px 6px}
.renin{display:block;font-size:17px;width:100%;box-sizing:border-box;border:1px solid var(--accent);border-radius:5px;padding:5px 7px;background:var(--bg);color:var(--fg)}
.renhint{display:block;font-size:11px;color:var(--muted);padding:3px 2px 0}
@media (hover:none){.doclink .ren{display:inline-flex}.doclink .t{padding-right:26px}}
.empty-folder{font-size:15px;color:var(--muted);padding:2px 8px 4px}
.addfolder{display:flex;gap:6px;padding:12px 6px 0}
.addfolder input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:8px 10px;font-size:16px}
.addfolder button{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:8px 12px;font-size:16px;cursor:pointer}

/* Hoveddel */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.docbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);
  padding-right:max(16px, env(safe-area-inset-right,0px))}
.menu-toggle{display:none}
.titlein{flex:1 1 220px;min-width:0;font-size:17px;font-weight:600;border:1px solid transparent;background:none;border-radius:5px;padding:4px 6px}
.titlein:hover,.titlein:focus{border-color:var(--line);background:var(--bg)}
.docbar label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.docbar select{border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:4px 6px}
.status{font-size:12px;color:var(--muted);min-width:90px;font-variant-numeric:tabular-nums}
.status.err{color:var(--danger)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 10px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--panel);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--danger)}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:6px 16px;border-bottom:1px solid var(--line);background:var(--panel);
  padding-right:max(16px, env(safe-area-inset-right,0px))}
.grp{display:flex;align-items:center;gap:2px;padding-right:6px;margin-right:2px;border-right:1px solid var(--line)}
.grp:last-child{border-right:0}
.tb{min-width:30px;height:30px;border:1px solid transparent;background:none;border-radius:5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;font-size:14px}
.tb:hover{background:var(--accent-soft)}
.tb.on{background:var(--accent-soft);border-color:var(--accent)}
.tb:disabled{opacity:.35;cursor:default;background:none}
.tb svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.toolbar select{height:30px;border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:0 4px}
.toolbar select.font{width:140px}
.toolbar .lbl{font-size:12px;color:var(--muted);padding:0 2px 0 4px}

.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 16px;background:var(--accent-soft);border-bottom:1px solid var(--line)}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 16px;background:var(--accent-soft);border-bottom:1px solid var(--line)}
.panel input[type=number]{width:60px;border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:3px 6px}

.scroll{flex:1;overflow:auto;overflow-anchor:none;min-height:0;padding:24px 56px 60px max(16px, env(safe-area-inset-left,0px))}
@media (max-width:760px){.scroll{padding-right:16px}}
.sheet{position:relative;--pad:2.54cm;width:210mm;max-width:100%;min-height:297mm;margin:0;background:var(--paper);color:var(--ink);
  box-shadow:0 1px 3px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.06);padding:2.54cm;box-sizing:border-box}
.zoomwrap{position:relative;overflow:hidden;margin-left:auto}
.zoomwrap > .sheet{transform-origin:0 0;max-width:none}
.zoomctl{position:fixed;right:calc(480px + 64px);bottom:max(20px, env(safe-area-inset-bottom,0px));z-index:15;display:inline-flex;align-items:center;gap:6px;
  padding:6px 8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.zoomctl[hidden]{display:none}
.zoomctl .btn{padding:4px 0;width:36px;font-size:18px;line-height:1.2}
.zoomctl select{border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:5px 6px;font-size:14px}
.zoomctl .btn:disabled{opacity:.4;cursor:default}
.placeholder{max-width:520px;margin:12vh auto 0;text-align:center;color:var(--muted);line-height:1.5}
.placeholder h2{color:var(--fg);font-size:20px;margin:0 0 8px}

/* Dokumentinnhold, felles for skjerm og PDF */
.doc{font-family:var(--doc);font-size:11pt;line-height:1.38;color:#000;outline:none;min-height:200mm;word-wrap:break-word}
.doc p{margin:0 0 8pt}
.doc h1{font-size:16pt;font-weight:700;margin:24pt 0 6pt;line-height:1.2}
.doc h2{font-size:13pt;font-weight:700;margin:18pt 0 4pt;line-height:1.25}
.doc h3{font-size:12pt;font-weight:700;margin:14pt 0 4pt;line-height:1.3}
.doc > :first-child{margin-top:0}
.doc ul,.doc ol{margin:0 0 8pt;padding-left:22pt}
.doc ul{list-style:disc}
.doc li{margin:0 0 2pt}
.doc table{border-collapse:collapse;width:100%;margin:0 0 10pt}
.doc table.t-fixed{table-layout:fixed}
.doc table.t-fixed td,.doc table.t-fixed th{box-sizing:border-box}
/* Kolonnebredde: markøren viser at streken mellom to kolonner kan dras */
.doc.colhover, .doc.colhover *{cursor:col-resize!important}
body.coldrag, body.coldrag *{cursor:col-resize!important;user-select:none!important}
.doc th,.doc td{border:.75pt solid #000;padding:3pt 6pt;vertical-align:top;text-align:left}
.doc th{font-weight:700}
.doc td p,.doc th p{margin:0}
.doc{position:relative}
.doc .pagebreak{height:28px;margin:var(--pad) calc(-1 * var(--pad) - 4px);background:var(--bg);
  box-shadow:inset 0 7px 6px -6px rgba(0,0,0,.22),inset 0 -7px 6px -6px rgba(0,0,0,.22);cursor:default;user-select:none}
.doc .pagebreak + *{margin-top:0}
.doc .toc{margin:0 0 14pt;padding:0;cursor:default}
.doc .toc-title{font-size:18pt;font-weight:700;margin:0 0 8pt}
.doc .toc-l1,.doc .toc-l2,.doc .toc-l3{display:flex;align-items:baseline}
.doc .toc-dots{flex:1;min-width:12pt;border-bottom:1px dotted #000;margin:0 4pt;transform:translateY(-3pt)}
.doc .toc-n{font-variant-numeric:tabular-nums}
.doc .toc-l1{margin:0 0 3pt;cursor:pointer;font-weight:700}
.doc .toc-l2{margin:0 0 3pt 14pt;cursor:pointer}
.doc .toc-l3{margin:0 0 3pt 28pt;cursor:pointer}
.doc .toc-empty{color:#6b7580;font-style:italic}
.doc .toc [data-h]:hover{text-decoration:underline}


.doc table.t-lines{border-top:.75pt solid #000}
.doc table.t-lines td,.doc table.t-lines th{border:0;border-bottom:.5pt solid #000}
.doc table.t-lines thead th{border-bottom:.75pt solid #000}
.doc table.t-greyhead th{background:#d9d9d9}
.doc table.t-zebra td,.doc table.t-zebra th{border-color:#999;border-width:.5pt}
.doc table.t-zebra tbody tr:nth-child(even of :not(.pgspace)) td{background:#f2f2f2}
.doc table.t-plain td,.doc table.t-plain th{border:0}
.doc table.t-plain thead th{border-bottom:.75pt solid #000}
.doc table.t-dark th{background:#000;color:#fff}
.doc tr.pgspace td{border:0!important;padding:0!important;background:none!important;font-size:0;line-height:0}
.doc table.t-lines tr.pgspace + tr > *{border-top:.75pt solid #000}
.doc td.cs,.doc th.cs{background:#cfe0ee;color:#000}
.doc table.has-cs ::selection{background:transparent}
.pnums{position:absolute;inset:0;pointer-events:none;user-select:none}
.pnums .softgap{position:absolute;left:-4px;right:-4px;height:28px;background:var(--bg);
  box-shadow:inset 0 7px 6px -6px rgba(0,0,0,.22),inset 0 -7px 6px -6px rgba(0,0,0,.22)}
.pnums span{position:absolute;right:var(--pad);font:9pt Calibri, Carlito, sans-serif;color:#555;transform:translateY(-50%)}
.tpick{gap:6px}
.tpick.btn{display:inline-flex;align-items:center;gap:8px;padding:4px 8px}
.tpick-caret{font-size:10px;color:var(--muted)}
.lbl2{font-size:13px}
.mini-paper{display:inline-flex;background:#fff;padding:3px;border-radius:3px;box-shadow:0 0 0 1px var(--line);line-height:0}
table.mini{border-collapse:collapse;width:42px}
table.mini th,table.mini td{height:5px;padding:0;border:1px solid #000;background:#fff}
.mini.t-lines th,.mini.t-lines td{border-width:0 0 1px 0}
.mini.t-lines tr:first-child th{border-top-width:1px}
.mini.t-greyhead th{background:#c4c4c4}
.mini.t-zebra th,.mini.t-zebra td{border-color:#9a9a9a}
.mini.t-zebra tr:nth-child(3) td{background:#e2e2e2}
.mini.t-plain th,.mini.t-plain td{border:0}
.mini.t-plain th{border-bottom:1px solid #000}
.mini.t-dark th{background:#000}
.cbtn{position:relative;flex-direction:column;gap:1px}
.cbtn .cico{font-weight:700;font-family:Georgia,serif;line-height:1}
.cbtn .cbar{display:block;width:18px;height:4px;border-radius:1px;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.cpop{position:fixed;z-index:31;padding:10px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;
  box-shadow:0 6px 20px rgba(0,0,0,.2);font-family:var(--ui);font-size:14px;width:252px}
.cpop .ct{font-weight:600;margin:0 0 8px}
.cpop .sw{display:grid;grid-template-columns:repeat(5,40px);gap:8px}
.cpop .sw button{width:40px;height:32px;border-radius:5px;border:1px solid rgba(0,0,0,.25);cursor:pointer;padding:0}
.cpop .sw button:hover{outline:2px solid var(--accent);outline-offset:1px}
.cpop .none{margin-top:10px;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px;cursor:pointer;font-size:14px}
.tpop{position:fixed;z-index:31;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:6px;width:min(380px,calc(100vw - 16px));
  background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.2);font-family:var(--ui);font-size:13px}
.tpop button{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid transparent;border-radius:6px;background:none;cursor:pointer;text-align:left;color:inherit}
.tpop button:hover{background:var(--accent-soft)}
.tpop button.on{border-color:var(--accent);background:var(--accent-soft)}
.tpop .mini-paper{padding:4px}
.tpop table.mini{width:56px}
.tpop table.mini th,.tpop table.mini td{height:7px}
.cellmenu{position:fixed;z-index:30;display:flex;flex-direction:column;gap:2px;padding:4px;background:var(--panel);color:var(--fg);
  border:1px solid var(--line);border-radius:7px;box-shadow:0 4px 16px rgba(0,0,0,.18);font-family:var(--ui);font-size:13px}
.cellmenu button{background:none;border:0;text-align:left;padding:6px 10px;border-radius:5px;cursor:pointer;white-space:nowrap}
.cellmenu button:hover{background:var(--accent-soft)}
.cellmenu button.danger{color:var(--danger)}

/* Skjul og vis sidepanelene (PC) */
.panelx{margin-left:auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;padding:6px 10px;font-size:14px;cursor:pointer;line-height:1}
.panelx:hover{border-color:var(--accent)}
.panelx .x{font-size:18px;line-height:1}
.tools-head{display:flex;align-items:center;gap:8px}
.tools-head .ttl{font-weight:700;font-size:16px}
.side-head .brandrow{display:flex;align-items:center;gap:8px}
.showbtn{display:none;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;padding:8px 12px;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap;flex:none}
.showbtn:hover{border-color:var(--accent)}
@media (min-width:761px){
  .app.no-tools{grid-template-columns:0 minmax(0,1fr) 480px}
  .app.no-side{grid-template-columns:380px minmax(0,1fr) 0}
  .app.no-tools.no-side{grid-template-columns:0 minmax(0,1fr) 0}
  .app.no-tools > .tools, .app.no-side > .side{display:none}
  .app.no-side > .topbar{grid-column:1 / 4}
  .app.no-tools #showTools, .app.no-side #showSide{display:inline-flex}
  .app.no-side .zoomctl{right:64px}
}
@media (max-width:760px){ .panelx{display:none} }
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto minmax(0,1fr)}
  .app > .topbar{grid-column:1;grid-row:1}
  .app > .tools{grid-column:1;grid-row:2}
  .app > .main{grid-column:1;grid-row:3}
  .topbar{padding:8px 12px}
  .topbar .titlein{font-size:18px}
  .side{position:fixed;inset:0 0 0 auto;width:min(480px,92vw);z-index:20;transform:translateX(105%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.25)}
  .side.open{transform:none}
  .menu-toggle{display:inline-flex}
  .sheet{--pad:16px;padding:18px 16px;min-height:60vh}
  .zoomctl{display:none}
  .zoomwrap{width:auto!important;height:auto!important;overflow:visible}
  .zoomwrap > .sheet{transform:none!important;max-width:100%}
  .toolbar select.font{width:110px}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
</style>

<div class="app">
  <aside class="side" id="side">
    <div class="side-head">
      <div class="brandrow"><div class="brand">Mine dokumenter</div><button class="panelx" id="hideSide" type="button" title="Skjul dokumentlisten" aria-label="Skjul dokumentlisten">Skjul <span class="x">×</span></button></div>
      <button class="newdoc" id="newDoc">+ Nytt dokument</button>
    </div>
    <div class="side-list" id="sideList"></div>
  </aside>

  <header class="topbar">
    <button class="showbtn" id="showTools" type="button" title="Vis verktøypanelet">› Verktøy</button>
    <input class="titlein" id="titleIn" placeholder="Uten tittel" aria-label="Dokumenttittel" disabled>
    <button class="showbtn" id="showSide" type="button" title="Vis dokumentlisten">Dokumenter ‹</button>
  </header>

  <aside class="tools" id="tools">
    <div class="tools-head"><span class="ttl">Verktøy</span><button class="panelx" id="hideTools" type="button" title="Skjul verktøypanelet" aria-label="Skjul verktøypanelet">Skjul <span class="x">×</span></button></div>
    <div class="docbar">
      <button class="btn menu-toggle" id="menuToggle">Dokumenter</button>
      <label>Mappe <select id="folderSel" disabled></select></label>
      <span class="status" id="status"></span>
      <button class="btn" id="pdfBtn" disabled>Last ned PDF</button>
      <button class="btn" id="docxBtn" disabled>Last ned Word</button>

<script>
(() => {
const FONTS = [
  ["Calibri", "Calibri, Carlito, 'Segoe UI', sans-serif"],
  ["Cambria", "Cambria, Caladea, Georgia, serif"],
  ["Arial", "Arial, Arimo, Helvetica, sans-serif"],
  ["Times New Roman", "'Times New Roman', Tinos, Times, serif"],
  ["Garamond", "Garamond, 'EB Garamond', Georgia, serif"],
  ["Georgia", "Georgia, Tinos, serif"],
  ["Verdana", "Verdana, Arimo, sans-serif"]
];
const SIZES = [8, 9, 10, 10.5, 11, 12, 14, 16, 18, 20, 24, 28, 36];
const DEFAULT_FOLDERS = ["Operations", "Concessions", "Felles"];

const $ = id => document.getElementById(id);
const editor = $("editor"), sheet = $("sheet"), placeholder = $("placeholder");
const titleIn = $("titleIn"), folderSel = $("folderSel"), statusEl = $("status");

let db = null, downloads = null;
let docs = {};                 // id -> data
let folders = DEFAULT_FOLDERS.slice();
let currentId = null, dirty = false, saveTimer = null, savedRange = null;
let pendingSize = null, pendingFont = null, confirmAction = null;
let local = false;             // true når lagring ikke er tilgjengelig

/* ---------- Hjelpere ---------- */
const fmtDate = ts => {
  if (!ts) return "";
  const d = new Date(ts), now = new Date();
  const same = d.toDateString() === now.toDateString();
  const hm = d.toLocaleTimeString("nb-NO", {hour:"2-digit", minute:"2-digit"});
  return same ? "I dag " + hm : d.toLocaleDateString("nb-NO", {day:"numeric", month:"short", year:"numeric"});
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function setStatus(t, err){ statusEl.textContent = t; statusEl.classList.toggle("err", !!err); }

/* ---------- Rensing av innhold (innliming og lasting) ---------- */
const TAGS = new Set(["P","H1","H2","H3","B","STRONG","I","EM","U","UL","OL","LI","TABLE","THEAD","TBODY","TR","TD","TH","BR","SPAN","DIV"]);
const DROP = new Set(["SCRIPT","STYLE","META","LINK","IFRAME","OBJECT","EMBED","TITLE","HEAD","SVG","IMG","VIDEO","AUDIO","CANVAS","INPUT","BUTTON","SELECT","TEXTAREA","FORM"]);
const STYLES = ["font-size","font-family","line-height","text-align","font-weight","font-style","text-decoration","color","background-color"];
const CLASSES = new Set(["pagebreak","toc","toc-title","toc-l1","toc-l2","toc-l3","toc-empty","toc-t","toc-dots","toc-n","t-lines","t-greyhead","t-zebra","t-plain","t-dark","t-fixed"]);
const RENAME = {H4:"H3",H5:"H3",H6:"H3"};
function unwrap(el){ const p = el.parentNode; while (el.firstChild) p.insertBefore(el.firstChild, el); el.remove(); }
function cleanNode(node){
  [...node.childNodes].forEach(n => {
    if (n.nodeType === 3) return;
    if (n.nodeType !== 1) { n.remove(); return; }
    let tag = n.tagName.toUpperCase();
    if (DROP.has(tag) || tag.includes(":")) { if (tag.includes(":") && n.textContent.trim()) { cleanNode(n); unwrap(n); } else n.remove(); return; }
    if (RENAME[tag]) { const h = document.createElement("h3"); while (n.firstChild) h.appendChild(n.firstChild); n.replaceWith(h); n = h; tag = "H3"; }
    cleanNode(n);
    if (!TAGS.has(tag)) { unwrap(n); return; }
    const style = n.getAttribute("style") || "";
    const cls = [...n.classList].filter(c => CLASSES.has(c));
    const span = {colspan:n.getAttribute("colspan"), rowspan:n.getAttribute("rowspan"), h:n.getAttribute("data-h")};
    [...n.attributes].forEach(a => n.removeAttribute(a.name));
    if (cls.length) n.className = cls.join(" ");
    if (span.colspan && /^\d+$/.test(span.colspan)) n.setAttribute("colspan", span.colspan);
    if (span.rowspan && /^\d+$/.test(span.rowspan)) n.setAttribute("rowspan", span.rowspan);
    if (span.h && /^\d+$/.test(span.h)) n.setAttribute("data-h", span.h);
    const kept = [];
    style.split(";").forEach(rule => {
      const i = rule.indexOf(":"); if (i < 0) return;
      const k = rule.slice(0, i).trim().toLowerCase(), v = rule.slice(i + 1).trim();
      if (STYLES.includes(k) && v && !/url|expression|javascript/i.test(v) && v.length < 200) kept.push(k + ":" + v);
      /* Kolonnebredde i prosent beholdes bare på tabellceller */
      else if (k === "width" && (tag === "TD" || tag === "TH") && /^\d+(\.\d+)?%$/.test(v)) kept.push(k + ":" + v);
    });
    if (kept.length) n.setAttribute("style", kept.join(";"));
    if (n.classList.contains("pagebreak") || n.classList.contains("toc")) n.setAttribute("contenteditable", "false");
    if (tag === "SPAN" && !n.attributes.length) unwrap(n);
  });
}
function sanitize(html){ const t = document.createElement("template"); t.innerHTML = html || ""; cleanNode(t.content); return t.innerHTML; }

/* ---------- Markering ---------- */
document.addEventListener("selectionchange", () => {
  const s = getSelection();
  if (s.rangeCount && editor.contains(s.anchorNode)) { savedRange = s.getRangeAt(0).cloneRange(); updateToolbar(); }
});
function restore(){
  flushTyping();
  const cur = getSelection();
  if (document.activeElement === editor && cur.rangeCount && editor.contains(cur.anchorNode)) { savedRange = cur.getRangeAt(0).cloneRange(); return; }
  editor.focus({preventScroll:true});
  if (savedRange) { const s = getSelection(); s.removeAllRanges(); s.addRange(savedRange); }
}
function exec(cmd, val){ restore(); document.execCommand(cmd, false, val ?? null); afterEdit(); }

/* ---------- Font og størrelse ---------- */
function convertFonts(){
  editor.querySelectorAll('font[size="7"]').forEach(f => {
    const s = document.createElement("span"); s.style.fontSize = (pendingSize || 11) + "pt";
    while (f.firstChild) s.appendChild(f.firstChild);
    s.querySelectorAll("span").forEach(x => { x.style.fontSize = ""; if (!x.getAttribute("style")) unwrap(x); });
    f.replaceWith(s);
  });
  editor.querySelectorAll("font[face]").forEach(f => {
    const entry = FONTS.find(x => x[0] === f.getAttribute("face"));
    const s = document.createElement("span"); s.style.fontFamily = entry ? entry[1] : FONTS[0][1];
    while (f.firstChild) s.appendChild(f.firstChild);
    s.querySelectorAll("span").forEach(x => { x.style.fontFamily = ""; if (!x.getAttribute("style")) unwrap(x); });
    f.replaceWith(s);
  });
  editor.querySelectorAll("font").forEach(unwrap);
}
function applySize(pt){
  pendingSize = pt; restore();
  document.execCommand("styleWithCSS", false, false);
  document.execCommand("fontSize", false, "7");
  convertFonts(); afterEdit();
}
function applyFont(name){
  pendingFont = name; restore();
  document.execCommand("styleWithCSS", false, false);
  document.execCommand("fontName", false, name);
  convertFonts(); afterEdit();
}

/* ---------- Linjeavstand ---------- */
function blocksInRange(){
  if (!savedRange) return [];
  const all = [...editor.querySelectorAll("p,h1,h2,h3,li,td,th")];
  let hit = all.filter(el => savedRange.intersectsNode(el) && !el.querySelector("p,h1,h2,h3,li"));
  if (!hit.length) {
    let n = savedRange.startContainer; n = n.nodeType === 3 ? n.parentNode : n;
    const b = n.closest && n.closest("p,h1,h2,h3,li,td,th"); if (b && editor.contains(b)) hit = [b];
  }
  return hit;
}
function applyLineHeight(v){
  restore();
  let blocks = blocksInRange();
  if (!blocks.length) { document.execCommand("formatBlock", false, "<p>"); savedRange = getSelection().getRangeAt(0).cloneRange(); blocks = blocksInRange(); }
  blocks.forEach(b => b.style.lineHeight = v);
  afterEdit();
}

/* ---------- Verktøylinjestatus ---------- */
function updateToolbar(){
  ["bold","italic","underline","insertUnorderedList","insertOrderedList","justifyLeft","justifyCenter","justifyRight","justifyFull"].forEach(c => {
    const b = document.querySelector('.tb[data-cmd="' + c + '"]');
    if (b) { let on = false; try { on = document.queryCommandState(c); } catch(e){} b.classList.toggle("on", on); }
  });
  let blk = ""; try { blk = (document.queryCommandValue("formatBlock") || "").toLowerCase(); } catch(e){}
  $("blockSel").value = ["h1","h2","h3"].includes(blk) ? blk : "p";
  if (savedRange) {
    let n = savedRange.startContainer; n = n.nodeType === 3 ? n.parentNode : n;
    if (n && editor.contains(n) || n === editor) {
      const cs = getComputedStyle(n);
      const pt = Math.round(parseFloat(cs.fontSize) * 0.75 * 2) / 2;
      const sizeSel = $("sizeSel");
      if (![...sizeSel.options].some(o => +o.value === pt)) { const o = new Option(String(pt).replace(".", ","), pt); o.dataset.temp = 1; sizeSel.add(o); }
      sizeSel.value = pt;
      const fam = cs.fontFamily.toLowerCase();
      const f = FONTS.find(x => x[1].toLowerCase().split(",").some(p => fam.split(",")[0].replace(/['"]/g,"").trim() === p.replace(/['"]/g,"").trim()));
      $("fontSel").value = f ? f[0] : "Calibri";
      const blockEl = n.closest("p,h1,h2,h3,li,td,th");
      const lh = blockEl && blockEl.style.lineHeight;
      $("lhSel").value = ["1.2","1.38","1.8","2.4"].includes(lh) ? lh : "1.38";
      const cell = n.closest("td,th");
      document.querySelectorAll(".tcell").forEach(b => b.disabled = !cell);
      if (cell) setPickBtn($("tStyleBtn"), TSTYLES.find(c => cell.closest("table").classList.contains(c)) || "", true);
    }
  }
}

/* ---------- Tekstfarge og markering ---------- */
const FG = [["#000000","Svart"],["#595959","Mørk grå"],["#C00000","Rød"],["#E26B0A","Oransje"],["#B8860B","Mørk gul"],
            ["#2E7D32","Grønn"],["#1F4E79","Mørk blå"],["#2F75B5","Blå"],["#7030A0","Lilla"],["#FFFFFF","Hvit"]];
const BG = [["#FFFF00","Gul"],["#FFE699","Lys oransje"],["#C6EFCE","Lys grønn"],["#DDEBF7","Lys blå"],["#F8CBAD","Lys rød"],
            ["#E4D7F5","Lys lilla"],["#E7E6E6","Lys grå"],["#BDD7EE","Blå"],["#A9D08E","Grønn"],["#FFC7CE","Rosa"]];
const cPop = $("cPop");
let cFor = null;
function openColors(kind, btn){
  if (cFor === kind) { closeColors(); return; }
  cFor = kind;
  const list = kind === "fg" ? FG : BG;
  cPop.innerHTML = '<div class="ct">' + (kind === "fg" ? "Tekstfarge" : "Markering") + '</div><div class="sw">' +
    list.map(([c, n]) => '<button type="button" data-c="' + c + '" title="' + n + '" aria-label="' + n + '" style="background:' + c + '"></button>').join("") +
    '</div><button type="button" class="none" data-c="">' + (kind === "fg" ? "Automatisk (svart)" : "Ingen markering") + '</button>';
  cPop.hidden = false;
  const r = btn.getBoundingClientRect(), w = cPop.offsetWidth, h = cPop.offsetHeight;
  cPop.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + "px";
  cPop.style.top = (r.bottom + h + 6 > innerHeight ? Math.max(8, r.top - h - 6) : r.bottom + 6) + "px";
}
function closeColors(){ cPop.hidden = true; cFor = null; }
function applyColor(kind, c){
  restore();
  document.execCommand("styleWithCSS", false, true);
  if (kind === "fg") document.execCommand("foreColor", false, c || "#000000");
  else { if (!document.execCommand("hiliteColor", false, c || "transparent")) document.execCommand("backColor", false, c || "transparent"); }
  document.execCommand("styleWithCSS", false, false);
  if (!c && kind === "bg") editor.querySelectorAll('[style*="background-color"]').forEach(el => {
    if (/transparent|rgba\(0, 0, 0, 0\)/.test(el.style.backgroundColor)) { el.style.backgroundColor = ""; if (!el.getAttribute("style")) { if (el.tagName === "SPAN") unwrap(el); else el.removeAttribute("style"); } }
  });
  if (c) $(kind === "fg" ? "fgBar" : "bgBar").style.background = c;
  afterEdit();
}
cPop.addEventListener("mousedown", e => e.preventDefault());
cPop.addEventListener("click", e => { const b = e.target.closest("[data-c]"); if (!b) return; const k = cFor; closeColors(); applyColor(k, b.dataset.c); });
$("fgBtn").addEventListener("click", e => { e.stopPropagation(); openColors("fg", $("fgBtn")); });
$("bgBtn").addEventListener("click", e => { e.stopPropagation(); openColors("bg", $("bgBtn")); });
document.addEventListener("click", e => { if (!cPop.hidden && !cPop.contains(e.target)) closeColors(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !cPop.hidden) closeColors(); });

/* ---------- Tabeller ---------- */
function insertTable(rows, cols, head, style){
  let h = style ? '<table class="' + style + '">' : "<table>";
  if (head) { h += "<thead><tr>" + Array.from({length:cols}, (_, i) => "<th><br></th>").join("") + "</tr></thead>"; }
  h += "<tbody>" + Array.from({length: head ? Math.max(rows - 1, 1) : rows}, () => "<tr>" + "<td><br></td>".repeat(cols) + "</tr>").join("") + "</tbody></table>";
  restore();
  const tpl = document.createElement("template"); tpl.innerHTML = h;
  const table = tpl.content.firstElementChild;
  /* Tabellen settes inn etter avsnittet markøren står i, eller erstatter et tomt avsnitt */
  let n = savedRange ? savedRange.startContainer : null;
  if (n && n.nodeType === 3) n = n.parentNode;
  let top = n && editor.contains(n) && n !== editor ? n : null;
  while (top && top.parentNode !== editor) top = top.parentNode;
  if (!top) editor.appendChild(table);
  else if (top.tagName === "P" && !top.textContent.trim() && !top.querySelector("ul,ol,table")) top.replaceWith(table);
  else top.after(table);
  if (!table.nextElementSibling || table.nextElementSibling.tagName !== "P") { const p = document.createElement("p"); p.innerHTML = "<br>"; table.after(p); }
  editor.focus({preventScroll:true}); caretInto(table.querySelector("td,th"), true);
  afterEdit();
  table.scrollIntoView({block:"nearest"});
}
/* Sletting av markerte tabeller: tabeller som er helt markert, eller der markeringen går ut over tabellen, fjernes */
editor.addEventListener("keydown", e => {
  if (e.key !== "Backspace" && e.key !== "Delete") return;
  const sel = getSelection(); if (!sel.rangeCount || sel.isCollapsed) return;
  const r = sel.getRangeAt(0); if (!editor.contains(r.commonAncestorContainer)) return;
  const doomed = [...editor.querySelectorAll("table")].filter(t => {
    if (!r.intersectsNode(t)) return false;
    const inside = t.contains(r.startContainer) && t.contains(r.endContainer);
    if (!inside) return true;
    const cells = t.querySelectorAll("td,th");
    return r.intersectsNode(cells[0]) && r.intersectsNode(cells[cells.length - 1]) && cells.length > 1;
  });
  if (!doomed.length) return;
  e.preventDefault(); flushTyping(); stripSpacers();
  const afterLast = doomed[doomed.length - 1].nextSibling;
  const marker = document.createElement("span");
  doomed[0].before(marker);
  doomed.forEach(t => t.remove());
  const s2 = getSelection();
  if (!s2.isCollapsed && s2.rangeCount && editor.contains(s2.anchorNode) && s2.toString().trim()) document.execCommand("delete");
  if (marker.isConnected) {
    let p = marker.parentNode === editor ? null : marker.closest("p,h1,h2,h3,li");
    if (!p) { p = document.createElement("p"); p.innerHTML = "<br>"; marker.replaceWith(p); }
    else marker.remove();
    caretInto(p, true);
  }
  afterEdit();
});
/* Rydder ugyldig struktur: lister og tabeller inne i avsnitt, og løse tabelldeler */
function normalizeBlocks(){
  const BLOCK = /^(UL|OL|TABLE|DIV)$/;
  const bad = [...editor.querySelectorAll("p,h1,h2,h3")].filter(el => [...el.children].some(c => BLOCK.test(c.tagName)));

function updateTable(t, R, C, head, style){

  /* Overskriftsrad av eller på */
  if (head && !t.tHead && t.rows.length) {
    const th = document.createElement("thead"); const first = t.rows[0];
    t.prepend(th); th.appendChild(first); [...first.cells].forEach(c => swapTag(c, "th"));
  } else if (!head && t.tHead) {

    [...t.tHead.rows].reverse().forEach(r => { tb.prepend(r); [...r.cells].forEach(c => swapTag(c, "td")); });
    t.tHead.remove();
  }
  /* Rader: legges til eller fjernes nederst */
  while (t.rows.length > R && t.rows.length > 1) t.rows[t.rows.length - 1].remove();

  if (keep) { const sl = getSelection(); sl.removeAllRanges(); sl.addRange(savedRange); } else caretInto(t.querySelector("td,th"), false);
  afterEdit();

function insertBreak(){

  if (n && n.nodeType === 3) n = n.parentNode;
  let top = n && editor.contains(n) && n !== editor ? n : null;
  while (top && top.parentNode !== editor) top = top.parentNode;
  /* I tabell, liste eller innholdsfortegnelse settes sideskiftet inn etter hele blokken */
  if (top && (/^(TABLE|UL|OL)$/.test(top.tagName) || top.classList.contains("toc"))) {
    const pb = document.createElement("div"); pb.className = "pagebreak"; pb.setAttribute("contenteditable", "false");

editor.addEventListener("paste", e => {
  const cd = e.clipboardData; if (!cd) return;
  e.preventDefault();
  const html = cd.getData("text/html");
  if (html) { document.execCommand("insertHTML", false, sanitize(html.replace(/<!--[\s\S]*?-->/g, ""))); }
  else {
    const txt = cd.getData("text/plain");

const PDF_FONTS = {

function pdfFontFor(family){

  const pick = s => [["calibri","Carlito"],["carlito","Carlito"],["cambria","Caladea"],["caladea","Caladea"],["arial","Arimo"],["arimo","Arimo"],
    ["helvetica","Arimo"],["verdana","Arimo"],["times","Tinos"],["tinos","Tinos"],["garamond","EBGaramond"],["georgia","Gelasio"],["gelasio","Gelasio"]]
    .find(([k]) => s.includes(k));

}
let pdfReady = null;

  return btoa(bin);

function preparePdf(){

    if (!window.pdfMake) await loadScript("https://cdn.jsdelivr.net/npm/pdfmake@0.3.11/build/pdfmake.min.js");
    const vfs = {}, fonts = {};
    await Promise.all(Object.entries(PDF_FONTS).map(async ([name, file]) => {
      fonts[name] = {};
      await Promise.all([["normal","400-normal"],["bold","700-normal"],["italics","400-italic"],["bolditalics","700-italic"]].map(async ([k, v]) => {
        const fn = file + "-latin-" + v + ".woff";
        const r = await fetch("fonts/" + fn); if (!r.ok) throw new Error("font");
        vfs[fn] = b64(await r.arrayBuffer()); fonts[name][k] = fn;
      }));
    }));
    /* Symboler som avkrysningsruter (☐) finnes ikke i tekstfontene, og hentes fra en egen symbolfont */
    const rs = await fetch("fonts/symbols-dejavu.ttf"); if (!rs.ok) throw new Error("font");
    vfs["symbols-dejavu.ttf"] = b64(await rs.arrayBuffer());
    fonts.Symbols = {normal:"symbols-dejavu.ttf", bold:"symbols-dejavu.ttf", italics:"symbols-dejavu.ttf", bolditalics:"symbols-dejavu.ttf"};
    pdfMake.addVirtualFileSystem(vfs);
    pdfMake.addFonts(fonts);
    if (pdfMake.setUrlAccessPolicy) pdfMake.setUrlAccessPolicy(() => false);

const SYMS = "☐☑☒✓✔✗✘→←↑↓↔⇒▪▫■□●○◦★☆♦◆◇►▶✱✳";

/* Markering ligger på et innebygd element (span o.l.) mellom teksten og avsnittet */

const PDF_NAT = {Carlito:1.2207, Caladea:1.15, Arimo:1.1499, Tinos:1.1499, EBGaramond:1.305, Gelasio:1.2695};

    '<w:pPr><w:tabs><w:tab w:val="right" w:leader="dot" w:pos="' + W_TEXT + '"/></w:tabs><w:spacing w:after="60"/><w:ind w:left="' + ind + '"/></w:pPr>' + (bold ? "<w:rPr><w:b/><w:bCs/></w:rPr>" : "") + "</w:style>";
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
    '<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:eastAsia="Calibri" w:cs="Calibri"/><w:sz w:val="22"/><w:szCs w:val="22"/><w:lang w:val="nb-NO" w:eastAsia="en-US" w:bidi="ar-SA"/></w:rPr></w:rPrDefault>' +
    '<w:pPrDefault><w:pPr><w:spacing w:after="160" w:line="276" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>' +
    '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style>' +
    h("Heading1", "heading 1", 32, 24, 6, 0) + h("Heading2", "heading 2", 26, 18, 4, 1) + h("Heading3", "heading 3", 24, 14, 4, 2) +
    '<w:style w:type="paragraph" w:styleId="TOCHeading"><w:name w:val="TOC Heading"/><w:basedOn w:val="Heading1"/><w:next w:val="Normal"/><w:uiPriority w:val="39"/><w:pPr><w:outlineLvl w:val="9"/></w:pPr></w:style>' +
    toc(1, 0, true) + toc(2, 280, false) + toc(3, 560, false) +
    '<w:style w:type="paragraph" w:styleId="Footer"><w:name w:val="footer"/><w:basedOn w:val="Normal"/><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/></w:pPr></w:style>' +
    '<w:style w:type="character" w:default="1" w:styleId="DefaultParagraphFont"><w:name w:val="Default Paragraph Font"/><w:uiPriority w:val="1"/><w:semiHidden/></w:style>' +
    '<w:style w:type="table" w:default="1" w:styleId="TableNormal"><w:name w:val="Normal Table"/><w:semiHidden/><w:tblPr><w:tblInd w:w="0" w:type="dxa"/><w:tblCellMar><w:top w:w="0" w:type="dxa"/><w:left w:w="108" w:type="dxa"/><w:bottom w:w="0" w:type="dxa"/><w:right w:w="108" w:type="dxa"/></w:tblCellMar></w:tblPr></w:style>' +
    '<w:style w:type="numbering" w:default="1" w:styleId="NoList"><w:name w:val="No List"/><w:semiHidden/></w:style>' +
    "</w:styles>";
}
/* Enkel zip-fil (uten komprimering), som er alt en .docx trenger */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b){ let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(files){
  const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  const d = new Date(), dt = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate(), tm = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  files.forEach(([name, text]) => {
    const nb = enc.encode(name), data = enc.encode(text), crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    [[0, 0x04034b50, 4], [4, 20, 2], [6, 0x0800, 2], [8, 0, 2], [10, tm, 2], [12, dt, 2], [14, crc, 4], [18, data.length, 4], [22, data.length, 4], [26, nb.length, 2], [28, 0, 2]]
      .forEach(([o, v, s]) => s === 4 ? h.setUint32(o, v, true) : h.setUint16(o, v, true));
    const c = new DataView(new ArrayBuffer(46));
    [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [8, 0x0800, 2], [10, 0, 2], [12, tm, 2], [14, dt, 2], [16, crc, 4], [20, data.length, 4], [24, data.length, 4],
     [28, nb.length, 2], [30, 0, 2], [32, 0, 2], [34, 0, 2], [36, 0, 2], [38, 0, 4], [42, off, 4]]
      .forEach(([o, v, s]) => s === 4 ? c.setUint32(o, v, true) : c.setUint16(o, v, true));
    parts.push(new Uint8Array(h.buffer), nb, data); central.push(new Uint8Array(c.buffer), nb);
    off += 30 + nb.length + data.length;
  });
  const cdSize = central.reduce((s, p) => s + p.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  [[0, 0x06054b50, 4], [4, 0, 2], [6, 0, 2], [8, files.length, 2], [10, files.length, 2], [12, cdSize, 4], [16, off, 4], [20, 0, 2]]
    .forEach(([o, v, s]) => s === 4 ? e.setUint32(o, v, true) : e.setUint16(o, v, true));
  return new Blob([...parts, ...central, new Uint8Array(e.buffer)], {type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}
function buildDocx(title){
  const {body, nums} = wDocx();
  const W = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"';
  const X = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const doc = X + "<w:document " + W + "><w:body>" + body +
    '<w:sectPr><w:footerReference w:type="default" r:id="rIdFooter"/><w:pgSz w:w="11906" w:h="16838"/>' +
    '<w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>';
  const footer = X + "<w:ftr " + W + '><w:p><w:pPr><w:pStyle w:val="Footer"/><w:jc w:val="right"/></w:pPr>' +
    '<w:r><w:rPr><w:color w:val="555555"/><w:sz w:val="18"/></w:rPr><w:fldChar w:fldCharType="begin"/></w:r><w:r><w:rPr><w:color w:val="555555"/><w:sz w:val="18"/></w:rPr><w:instrText xml:space="preserve"> PAGE </w:instrText></w:r>' +
    '<w:r><w:rPr><w:color w:val="555555"/><w:sz w:val="18"/></w:rPr><w:fldChar w:fldCharType="separate"/></w:r><w:r><w:rPr><w:color w:val="555555"/><w:sz w:val="18"/></w:rPr><w:t>1</w:t></w:r>' +
    '<w:r><w:rPr><w:color w:val="555555"/><w:sz w:val="18"/></w:rPr><w:fldChar w:fldCharType="end"/></w:r></w:p></w:ftr>';
  const now = new Date().toISOString().replace(/\.\d+Z$/, "Z");
  return makeZip([
    ["[Content_Types].xml", X + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
      '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>' +
      '<Override PartName="/word/numbering.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.numbering+xml"/>' +
      '<Override PartName="/word/settings.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.settings+xml"/>' +
      '<Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/>' +
      '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>'],
    ["_rels/.rels", X + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
      '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>'],
    ["docProps/core.xml", X + '<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">' +
      "<dc:title>" + wx(title) + "</dc:title><dc:creator>Mine dokumenter</dc:creator><dc:language>nb-NO</dc:language>" +
      '<dcterms:created xsi:type="dcterms:W3CDTF">' + now + '</dcterms:created><dcterms:modified xsi:type="dcterms:W3CDTF">' + now + "</dcterms:modified></cp:coreProperties>"],
    ["word/_rels/document.xml.rels", X + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rIdStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
      '<Relationship Id="rIdNum" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/numbering" Target="numbering.xml"/>' +
      '<Relationship Id="rIdSettings" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/settings" Target="settings.xml"/>' +
      '<Relationship Id="rIdFooter" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/></Relationships>'],
    ["word/document.xml", doc],
    ["word/styles.xml", wStyles()],
    ["word/numbering.xml", wNumbering(nums)],
    ["word/settings.xml", X + '<w:settings xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:defaultTabStop w:val="708"/><w:characterSpacingControl w:val="doNotCompress"/>' +
      '<w:compat><w:compatSetting w:name="compatibilityMode" w:uri="http://schemas.microsoft.com/office/word" w:val="15"/></w:compat></w:settings>'],
    ["word/footer1.xml", footer]
  ]);
}
$("docxBtn").addEventListener("click", async () => {
  if (!currentId || !downloads) return;
  const btn = $("docxBtn"); if (btn.dataset.busy) return;
  btn.dataset.busy = "1"; btn.disabled = true;
  $("tablePanel").hidden = true;
  setStatus("Lager Word-fil …");
  try {
    const title = titleIn.value.trim() || "Uten tittel";
    const blob = buildDocx(title);
    const name = title.replace(/[\\/:*?"<>|]+/g, "-").slice(0, 120) + ".docx";
    setStatus("Bekreft lagringen i vinduet som åpnes.");
    await downloads.save({filename:name, data:blob});
    setStatus("Word-filen er lagret");
  } catch (e) {
    setStatus(e && e.code === "declined" ? "Lagringen ble avbrutt" : "Fikk ikke laget Word-filen. Be Claude lage den i chatten.", true);
    console.error(e);
  } finally {
    delete btn.dataset.busy; btn.disabled = !currentId || !downloads;
    queueLayout();
  }
});

/* ---------- Zoom: arket skaleres på skjermen. Sideinndeling og PDF påvirkes ikke. ---------- */
const ZOOMS = [50, 67, 75, 90, 100, 110, 125, 150, 175, 200];
const zwrap = $("zoomwrap");
let zoom = 1;
try { const v = +localStorage.getItem("md-zoom"); if (ZOOMS.includes(v)) zoom = v / 100; } catch(e){}
const narrowScreen = () => matchMedia("(max-width:760px)").matches;
function curZoom(){ return narrowScreen() ? 1 : zoom; }
function fitZoom(){
  const z = curZoom();
  $("zoomCtl").hidden = sheet.hidden;
  sheet.style.transform = z === 1 ? "" : "scale(" + z + ")";
  if (narrowScreen() || sheet.hidden) { zwrap.style.width = ""; zwrap.style.height = ""; return; }
  zwrap.style.width = sheet.offsetWidth * z + "px";
  zwrap.style.height = sheet.offsetHeight * z + "px";
}
function setZoom(pct){
  pct = Math.max(ZOOMS[0], Math.min(ZOOMS[ZOOMS.length - 1], pct));
  zoom = pct / 100; $("zSel").value = pct;
  try { localStorage.setItem("md-zoom", pct); } catch(e){}
  $("zOut").disabled = pct <= ZOOMS[0]; $("zIn").disabled = pct >= ZOOMS[ZOOMS.length - 1];
  fitZoom();
}
$("zSel").innerHTML = ZOOMS.map(z => '<option value="' + z + '">' + z + " %</option>").join("");
$("zIn").addEventListener("click", () => { const c = Math.round(zoom * 100); setZoom(ZOOMS.find(z => z > c) ?? ZOOMS[ZOOMS.length - 1]); });
$("zOut").addEventListener("click", () => { const c = Math.round(zoom * 100); setZoom([...ZOOMS].reverse().find(z => z < c) ?? ZOOMS[0]); });
$("zSel").addEventListener("change", e => setZoom(+e.target.value));
$("zIn").addEventListener("mousedown", e => e.preventDefault());
$("zOut").addEventListener("mousedown", e => e.preventDefault());
if (window.ResizeObserver) new ResizeObserver(fitZoom).observe(sheet);
window.addEventListener("resize", fitZoom);
setZoom(Math.round(zoom * 100));


/* ---------- Skjul og vis sidepanelene ---------- */
const appEl = document.querySelector(".app");
function setPanels(tools, side){
  appEl.classList.toggle("no-tools", !tools);
  appEl.classList.toggle("no-side", !side);
  try { localStorage.setItem("md-panels", JSON.stringify({tools, side})); } catch(e){}
  if (typeof fitZoom === "function") fitZoom();
  queueLayout();
}
let panelState = {tools:true, side:true};
try { const v = JSON.parse(localStorage.getItem("md-panels") || "null"); if (v) panelState = {tools: v.tools !== false, side: v.side !== false}; } catch(e){}
$("hideTools").addEventListener("click", () => { panelState.tools = false; setPanels(panelState.tools, panelState.side); });
$("showTools").addEventListener("click", () => { panelState.tools = true; setPanels(panelState.tools, panelState.side); });
$("hideSide").addEventListener("click", () => { panelState.side = false; setPanels(panelState.tools, panelState.side); });
$("showSide").addEventListener("click", () => { panelState.side = true; setPanels(panelState.tools, panelState.side); });
setPanels(panelState.tools, panelState.side);
/* ---------- Oppstart ---------- */
renderSide(); renderFolderSel(); showEmpty();
placeholder.innerHTML = "<h2>Laster dokumentene …</h2>";
(async () => {
  const cl = window.claude;
  if (!cl || !cl.use) { local = true; db = null; noStore(); return; }
  [db, downloads] = await Promise.all([cl.use("db").catch(() => null), cl.use("downloads").catch(() => null)]);
  if (!downloads) { $("pdfBtn").title = "PDF-nedlasting er ikke tilgjengelig her. Be Claude lage PDF-en."; $("docxBtn").title = "Word-nedlasting er ikke tilgjengelig her. Be Claude lage Word-filen."; }
  if (!db) { local = true; noStore(); return; }
  try { const s = await db.doc("meta/settings").get(); if (s.exists && Array.isArray(s.data().folders) && s.data().folders.length) folders = s.data().folders; } catch(e){}
  renderFolderSel();
  let first = true;
  db.collection("docs").onSnapshot(snap => {
    snap.docs.forEach(ds => {
      const v = ds.data(); if (!v) return;
      const mine = docs[ds.id];
      if (ds.id === currentId && (dirty || document.activeElement === editor)) return;
      docs[ds.id] = {title:v.title, folder:v.folder, html:v.html, created:v.created, updated:v.updated};
      if (!folders.includes(v.folder)) { folders.push(v.folder); renderFolderSel(); }
      if (ds.id === currentId && mine && mine.updated !== v.updated) { editor.innerHTML = sanitize(v.html); titleIn.value = v.title; resetHistory(); queueLayout(); }
    });
    const ids = new Set(snap.docs.map(d => d.id));
    Object.keys(docs).forEach(id => { if (!ids.has(id) && id !== currentId) delete docs[id]; });
    renderSide();
    if (first) {
      first = false;
      let last = null; try { last = localStorage.getItem("md-last"); } catch(e){}
      if (last && docs[last]) openDoc(last); else showEmpty();
    }
  }, err => { setStatus("Mistet kontakten med lagringen", true); });
})();
function noStore(){
  placeholder.innerHTML = "<h2>Lagring er ikke tilgjengelig her</h2><p>Åpne Mine dokumenter i Claude mens du er logget inn for å lagre. Du kan skrive her, men teksten forsvinner når siden lukkes.</p>";
  $("newDoc").textContent = "+ Nytt dokument (lagres ikke)";
}
})();
</script>
